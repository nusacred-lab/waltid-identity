name: Keychain process lifecycle control (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

jobs:
  keychain-lifecycle:
    timeout-minutes: 30
    runs-on: xcode-27
    steps:
      - name: Checkout the failing Keychain tuple
        uses: walt-id/waltid-identity/.github/actions/checkout-repos@d689d1e773d6918cc42299b3cf9563a9ebce3ca0
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN || github.token }}
          resolved-refs: >-
            {"unified":"1fef89185ad62339246905d88c45cbcac37341e6","identity":"656e059cc0fec8e9b7b4dbd55fef5089969b10ec","enterprise":"b9e7258c74c54116d5a8bfe72bf2c6d7febdffe4","enterprise_license":"78972ba6237a00e3e867c0a74192e161128375f7"}
      - name: Checkout the temporary control
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: probe-harness
      - name: Configure Gradle
        uses: ./waltid-identity/.github/actions/gradle-setup-action
      - name: Configure iOS builds
        uses: ./waltid-identity/.github/actions/ios-build-setup
        with:
          gradle-properties-path: waltid-identity/gradle.properties
      - name: Observe the existing Keychain suite
        run: python3 probe-harness/.github/scripts/mobile-ci/temporary-keychain-lifecycle-probe.py
      - name: Retain lifecycle and actual test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: keychain-lifecycle
          path: |
            keychain-lifecycle/*.json
            keychain-lifecycle/*.log
            keychain-lifecycle/baseline-*/*.json
            keychain-lifecycle/baseline-*/*.log
            keychain-lifecycle/baseline-*/*.xml
          if-no-files-found: error
          retention-days: 7
