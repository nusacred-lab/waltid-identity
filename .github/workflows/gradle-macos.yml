name: Mobile fixture stability probe (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

jobs:
  fixture-control:
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: pr-base
            identity: d53d7bc1202a8774e8d41ebd6b147715cdea69d5
            enterprise: 89e95913c9142673defc5aca41bd1e0dc1a9c4b1
          - source: main
            identity: d53d7bc1202a8774e8d41ebd6b147715cdea69d5
            enterprise: 05450052962e805e4c85e42a4fe6432cd7c9a852
          - source: candidate
            identity: f4996d9bfea669c48187f2c0474cfdbed1979bf8
            enterprise: b9e7258c74c54116d5a8bfe72bf2c6d7febdffe4
    steps:
      - name: Checkout exact coordinated source
        uses: walt-id/waltid-identity/.github/actions/checkout-repos@d689d1e773d6918cc42299b3cf9563a9ebce3ca0
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN || github.token }}
          resolved-refs: >-
            {"unified":"1fef89185ad62339246905d88c45cbcac37341e6","identity":"${{ matrix.identity }}","enterprise":"${{ matrix.enterprise }}","enterprise_license":"78972ba6237a00e3e867c0a74192e161128375f7"}
      - name: Checkout temporary experiment
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: probe-harness
      - name: Configure Gradle
        uses: ./waltid-identity/.github/actions/gradle-setup-action
      - name: Build the actual fixture
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/fixture-control"
          cp probe-harness/.github/scripts/mobile-ci/temporary-fixture-probe/fixture-control.py "$RUNNER_TEMP/fixture-control/"
          ./gradlew :waltid-enterprise-integration-tests:captureMobileFixtureLaunch \
            -I "$GITHUB_WORKSPACE/probe-harness/.github/scripts/mobile-ci/temporary-fixture-probe/fixture-launch.init.gradle" \
            -PfixtureLaunchOutput="$RUNNER_TEMP/fixture-control/fixture-launch.json" \
            --no-configuration-cache --no-daemon --max-workers=3 \
            -Dorg.gradle.parallel=false '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8'
      - name: Repeat fresh fixture starts and reused-connection requests
        run: python3 "$RUNNER_TEMP/fixture-control/fixture-control.py"
      - name: Retain bounded experiment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fixture-control-${{ matrix.source }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fixture-control/fixture-control-results.json
            ${{ runner.temp }}/fixture-control/*-threads.log
          if-no-files-found: warn
          retention-days: 7
