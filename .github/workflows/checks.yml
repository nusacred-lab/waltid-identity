name: Repository checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 ci/check_policy.py
      - run: python3 ci/install_tool.py actionlint "$RUNNER_TEMP/tools"
      - name: Validate workflow syntax and expressions
        run: '"$RUNNER_TEMP/tools/actionlint" -shellcheck="" -pyflakes=""'
      - run: python3 ci/install_tool.py gitleaks "$RUNNER_TEMP/tools"
      - name: Scan complete Git history (redacted)
        run: '"$RUNNER_TEMP/tools/gitleaks" git . --redact --no-banner'
  source-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 ci/install_tool.py trivy "$RUNNER_TEMP/tools"
      - name: Configure isolated scanner cache
        run: echo "TRIVY_CACHE_DIR=$RUNNER_TEMP/source-trivy-cache" >> "$GITHUB_ENV"
      - name: Scan source dependency manifests including upstream frontends
        run: |
          mkdir -p source-evidence
          "$RUNNER_TEMP/tools/trivy" fs --include-dev-deps --scanners vuln --format json \
            --severity HIGH,CRITICAL --exit-code 1 \
            --output source-evidence/vulnerabilities.json .
          python3 ci/check-scanner-db.py "$TRIVY_CACHE_DIR/db/metadata.json"
      - name: Generate source SBOM even when vulnerabilities block the gate
        if: always()
        run: |
          mkdir -p source-evidence
          "$RUNNER_TEMP/tools/trivy" fs --include-dev-deps --format cyclonedx \
            --output source-evidence/sbom.cdx.json .
          cp "$TRIVY_CACHE_DIR/db/metadata.json" source-evidence/db-metadata.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: source-dependency-evidence
          path: source-evidence/
          retention-days: 7
          if-no-files-found: error
  frontend-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [waltid-credentials, waltid-web-portal2, waltid-digital-credentials]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 ci/verify-npm-review.py
      - name: Install reviewed package manager and native headers
        run: |
          python3 ci/install-npm.py "$RUNNER_TEMP/npm-tool"
          python3 ci/install-node-headers.py "$RUNNER_TEMP/node-headers"
      - name: Build with offline lifecycle scripts and test documentation SSR
        env:
          FRONTEND_APP: ${{ matrix.app }}
        run: bash ci/test-frontends.sh "$FRONTEND_APP"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: frontend-${{ matrix.app }}-evidence
          path: build/frontend-evidence/${{ matrix.app }}/
          retention-days: 7
          if-no-files-found: warn
  security:
    if: always()
    needs: [source-controls, source-dependencies, frontend-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require source controls, dependency scans and frontend builds
        env:
          SOURCE_CONTROLS_RESULT: ${{ needs.source-controls.result }}
          SOURCE_DEPENDENCIES_RESULT: ${{ needs.source-dependencies.result }}
          FRONTEND_BUILD_RESULT: ${{ needs.frontend-build.result }}
        run: |
          test "$SOURCE_CONTROLS_RESULT" = success
          test "$SOURCE_DEPENDENCIES_RESULT" = success
          test "$FRONTEND_BUILD_RESULT" = success
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
          fail-on-scopes: runtime,development,unknown
